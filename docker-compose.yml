services:
  postgres:
    image: postgres:16-alpine
    container_name: img-vdo-postgres
    environment:
      POSTGRES_USER: storybook
      POSTGRES_PASSWORD: storybook123
      POSTGRES_DB: image_video_storybook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storybook -d image_video_storybook"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: img-vdo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: img-vdo-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    container_name: img-vdo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/video-storage &&
      mc anonymous set download local/video-storage || true
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: img-vdo-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://storybook:storybook123@postgres:5432/image_video_storybook
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-to-a-long-random-secret-at-least-32-chars
      CORS_ORIGIN: http://localhost:3000
      PUBLIC_API_URL: http://localhost:3001
      STORAGE_BACKEND: s3
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: video-storage
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/video-storage
      REQUIRE_AGE_VERIFICATION: "true"
      MIN_AGE: "18"
      ADULT_CONTENT_ALLOWED: "true"
      UNRESTRICTED_MODE: "true"
    ports:
      - "3001:3001"
    volumes:
      - api_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: img-vdo-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://storybook:storybook123@postgres:5432/image_video_storybook
      REDIS_URL: redis://redis:6379
      STORAGE_BACKEND: s3
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: video-storage
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/video-storage
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      RUNWAY_API_KEY: ${RUNWAY_API_KEY:-}
      PIKA_API_KEY: ${PIKA_API_KEY:-}
    volumes:
      - api_uploads:/app/uploads
    restart: unless-stopped

  # One-shot migrate helper: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://storybook:storybook123@postgres:5432/image_video_storybook
    working_dir: /app/apps/api
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  api_uploads:

networks:
  default:
    name: img-vdo-network

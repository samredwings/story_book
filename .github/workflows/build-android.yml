name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_DEBUG_MODE: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: rm -f package-lock.json && npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Type check
        run: npm run type-check

      - name: Build web app
        run: |
          cd apps/web
          npm run build

      - name: Setup Capacitor Android
        run: |
          cd apps/web
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          mkdir -p android/app/src/main/res/xml
          cp ../../network_security_config.xml android/app/src/main/res/xml/ 2>/dev/null || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: img-vdo-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
